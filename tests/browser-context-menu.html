<!doctype html>
<html lang="zh-CN">

<title>正文右键空行回归</title>
<style>
  body { padding: 20px; }
  nav { display: flex; gap: 12px; margin-bottom: 16px; }
  nav button { padding: 8px 12px; border: 1px solid var(--line); }

  #editor .cm-content { padding-top: 20px; }

</nav>
<div id="editor"></div>
<pre id="result" aria-label="当前 Markdown"></pre>
