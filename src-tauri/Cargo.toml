[package]
name = "foldmark"
version = "0.5.0"
description = "Markdown task editor"
license = "MIT"
edition = "2021"

[lib]
name = "foldmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-opener = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
notify = "8"
similar = "2"
url = "2"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
fontdb = "0.24.0"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
