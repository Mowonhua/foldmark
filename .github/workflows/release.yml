# 文件职责：将通过验证的版本标签发布为签名安装包，并提升静态更新频道。
# 定义范围：Windows x64 NSIS、Android arm64 APK 构建、GitHub Release 与 updates 分支写入。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 所有版本共用发布锁；已经开始的版本不能被新标签取消到一半。
concurrency:
  group: foldmark-release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  android:
    name: Build signed Android arm64
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-arm64
      - run: npm ci
      - name: Install Android SDK packages
        run: |
          1..100 | ForEach-Object { 'y' } | & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" --licenses
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK 许可确认失败。' }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.2.12479018'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK 安装失败。' }
          "NDK_HOME=$env:ANDROID_HOME/ndk/27.2.12479018" >> $env:GITHUB_ENV
      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64) -or [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS)) {
            throw '缺少 Android 签名 secrets。'
          }
          $taskKeystore = Join-Path $env:RUNNER_TEMP 'foldmark-android.jks'
          $taskPassword = Join-Path $env:RUNNER_TEMP 'foldmark-android.password'
          [IO.File]::WriteAllBytes($taskKeystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          [IO.File]::WriteAllText($taskPassword, $env:ANDROID_KEYSTORE_PASSWORD)
          "FOLDMARK_ANDROID_KEYSTORE=$taskKeystore" >> $env:GITHUB_ENV
          "FOLDMARK_ANDROID_PASSWORD_FILE=$taskPassword" >> $env:GITHUB_ENV
          "FOLDMARK_ANDROID_KEY_ALIAS=$env:ANDROID_KEY_ALIAS" >> $env:GITHUB_ENV
      - name: Build and verify signed APK
        run: ./scripts/build-android.ps1
      - name: Remove temporary signing files
        if: always()
        run: |
          # 只清理当前 runner 临时目录内的两个固定文件，不操作签名来源。
          foreach ($taskName in @('foldmark-android.jks', 'foldmark-android.password')) {
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $taskName) -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foldmark-android-arm64
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows x64 and Android arm64
    needs: [check, android]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows
      - run: npm ci
      - name: Validate version tag
        id: version
        run: node scripts/release.mjs validate
      - name: Build signed NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '缺少仓库 secret TAURI_SIGNING_PRIVATE_KEY'
          }
          npx tauri build -- --locked
      # APK 必须在整理资源前下载，两个平台共同通过摘要校验后才能公开版本。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: foldmark-android-arm64
          path: dist-android
      - name: Prepare and verify release files
        id: prepare
        env:
          RELEASE_DIR: ${{ runner.temp }}/foldmark-release
        run: node scripts/release.mjs prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foldmark-${{ steps.version.outputs.version }}-release
          path: ${{ runner.temp }}/foldmark-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified release and update channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIR: ${{ runner.temp }}/foldmark-release
        run: node scripts/release-github.mjs
